<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1224">
  <title>云鲸星轮 · Cloudwhale Astrolabe</title>
  <meta name="description" content="一头浮游云海的体素巨鲸，背负巨型星象轮盘与东方楼阁。可自由漫游、切换晨光与星夜的互动体素世界。">
  <meta property="og:title" content="云鲸星轮 · Cloudwhale Astrolabe">
  <meta property="og:description" content="鲸背之上，星轮流转。一个可自由探索的体素云海世界。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="is-day is-loading">
  <div id="scene" aria-hidden="true"></div>
  <div class="atmosphere" aria-hidden="true">
    <div class="vignette"></div>
    <div class="grain"></div>
  </div>

  <div id="loader" class="loader" aria-live="polite">
    <div class="loader-inner">
      <div class="loader-cube" aria-hidden="true">
        <span class="cube-face f1"></span><span class="cube-face f2"></span><span class="cube-face f3"></span>
        <span class="cube-face f4"></span><span class="cube-face f5"></span><span class="cube-face f6"></span>
      </div>
      <p class="loader-eyebrow">VOXEL ATLAS · 37°N</p>
      <h1 class="loader-title">云鲸星轮</h1>
      <p class="loader-sub">CLOUDWHALE ASTROLABE</p>
      <div class="loader-track"><span id="loaderBar"></span></div>
      <p id="loaderStatus" class="loader-status">正在唤醒云海</p>
    </div>
    <span class="loader-coord">E 121°12′ · N 31°06′ · 1,284 M</span>
  </div>

  <header class="brand">
    <div class="brand-mark" aria-hidden="true">
      <span class="brand-ring"></span>
      <span class="brand-star"></span>
      <i></i><i></i><i></i><i></i>
    </div>
    <div class="brand-copy">
      <p class="eyebrow">VOXEL ATLAS <span>/</span> NO. 37</p>
      <h1>云鲸星轮</h1>
      <p class="brand-sub">CLOUDWHALE ASTROLABE</p>
    </div>
  </header>

  <div class="cycle-wrap">
    <p class="cycle-kicker" id="cycleKicker">晨光 · 06:42</p>
    <button id="dayNight" class="cycle" type="button" aria-label="切换到星夜" aria-pressed="false">
      <span class="cycle-icons" aria-hidden="true">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M20.2 14.3A8.4 8.4 0 0 1 9.7 3.8 8.5 8.5 0 1 0 20.2 14.3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M17.2 4.4v3M15.7 5.9h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.1" stroke="currentColor" stroke-width="1.3"/><path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </span>
      <span class="cycle-label" id="cycleLabel">入夜</span>
      <span class="cycle-sep" aria-hidden="true"></span>
      <span class="cycle-note" id="cycleNote">星轮将明</span>
    </button>
  </div>

  <aside class="view-rail" aria-label="观景视角">
    <p class="rail-title">视界 <span>VISTAS</span></p>
    <button class="view-btn is-active" type="button" data-view="overview" aria-label="全景视角">
      <span class="view-index">01</span><span class="view-name">寰宇</span><span class="view-rule"></span>
    </button>
    <button class="view-btn" type="button" data-view="wheel" aria-label="星轮视角">
      <span class="view-index">02</span><span class="view-name">星轮</span><span class="view-rule"></span>
    </button>
    <button class="view-btn" type="button" data-view="towers" aria-label="塔楼视角">
      <span class="view-index">03</span><span class="view-name">楼阁</span><span class="view-rule"></span>
    </button>
    <button class="view-btn" type="button" data-view="head" aria-label="鲸首视角">
      <span class="view-index">04</span><span class="view-name">鲸首</span><span class="view-rule"></span>
    </button>
    <button class="view-btn" type="button" data-view="clouds" aria-label="云海视角">
      <span class="view-index">05</span><span class="view-name">云海</span><span class="view-rule"></span>
    </button>
    <button id="tourBtn" class="tour-btn" type="button" aria-label="开始自动巡游" aria-pressed="false">
      <span class="tour-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.4" stroke="currentColor" stroke-width="1.1" stroke-dasharray="1.6 3.2"/><path d="M10 8.7 15.3 12 10 15.3V8.7Z" fill="currentColor"/></svg></span>
      <span>巡游</span>
    </button>
  </aside>

  <div class="readout">
    <div class="readout-top"><span class="pulse"></span><span id="readoutMode">晨光航行</span></div>
    <p class="readout-alt">云海之上 <strong>1,284</strong> 米</p>
    <p class="readout-meta">星轮历 037 · 东南风 3 级</p>
    <svg class="constellation" viewBox="0 0 160 44" aria-hidden="true">
      <path d="M4 31 29 17 51 24 76 9 105 18 131 8 156 20" fill="none" stroke="currentColor" stroke-width=".7" opacity=".5"/>
      <g fill="currentColor"><circle cx="4" cy="31" r="1.2"/><circle cx="29" cy="17" r="1.8"/><circle cx="51" cy="24" r="1"/><circle cx="76" cy="9" r="2.2"/><circle cx="105" cy="18" r="1.1"/><circle cx="131" cy="8" r="1.6"/><circle cx="156" cy="20" r="1"/></g>
    </svg>
  </div>

  <footer class="footer">
    <p class="hint"><span><kbd>拖拽</kbd>旋转</span><span><kbd>滚轮</kbd>缩放</span><span><kbd>右键</kbd>平移</span><span><kbd>W A S D</kbd>漫游</span></p>
    <p class="hint-mobile">单指旋转 · 双指缩放 · 下方切换视角</p>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
